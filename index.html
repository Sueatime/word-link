<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Links</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--h:260;--bg:hsl(var(--h) 30% 9%);--panel:hsl(var(--h) 26% 15%);--ink:hsl(var(--h) 60% 95%);--muted:hsl(var(--h) 20% 68%);--tile:hsl(var(--h) 40% 30%);--pur:hsl(var(--h) 70% 68%);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Outfit",system-ui,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:480px;padding:24px 16px 40px;text-align:center}
h1{margin:0 0 4px;font-size:28px}
.sub{margin:0 0 14px;color:var(--muted);font-size:15px}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.prompt{background:var(--panel);border:3px solid var(--pur);border-radius:16px;padding:16px 12px;margin:0 auto 12px;max-width:360px}
.prompt small{display:block;color:var(--muted);font-size:13px;margin-bottom:4px}
.prompt b{font-size:clamp(30px,10vw,44px);letter-spacing:3px;text-transform:uppercase}
#stat{color:var(--muted);font-size:14px;font-weight:600;margin-bottom:12px}
.ans{display:flex;align-items:center;justify-content:center;gap:8px;margin:5px 0}
.ans .n{width:20px;text-align:right;color:var(--muted);font-weight:700;font-size:13px}
.ans .p{width:34px;text-align:left;color:var(--muted);font-size:12px;font-weight:700}
.tiles{display:flex;gap:3px;justify-content:center;min-width:0}
.t{width:clamp(16px,5.4vw,28px);height:clamp(22px,7vw,34px);border-radius:5px;background:transparent;border:2px solid var(--muted);display:grid;place-items:center;font-size:clamp(11px,3.8vw,18px);font-weight:700;text-transform:uppercase;color:#fff}
.ans.found .t{background:var(--pur);border-color:var(--pur);color:#1a1033}
.ans.missed .t{background:var(--tile);border-color:var(--tile);color:var(--ink)}
input{font:inherit;font-size:20px;padding:10px 12px;border-radius:8px;border:2px solid var(--pur);background:transparent;color:var(--ink);width:230px;text-align:center;text-transform:lowercase}
button{font:inherit;font-weight:600;padding:10px 18px;border-radius:8px;border:0;background:var(--pur);color:#1a1033;cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:2px solid var(--muted)}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
#msg{min-height:26px;font-weight:600;margin:6px 0 12px}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:10}
</style>
</head>
<body>
<main>
  <h1>Word Links</h1>
  <p class="sub">Find the 8 most common words that go with the word below.</p>
  <div class="prompt"><small>Words linked to</small><b id="prompt"></b></div>
  <div id="stat"></div>
  <div id="board"></div>
  <div class="row" style="margin-top:14px"><input id="g" autocomplete="off" autocapitalize="none" aria-label="A linked word"><button id="go">Add</button></div>
  <div id="msg" role="status"></div>
  <div class="row"><button class="ghost" id="new">New word</button><button class="ghost" id="hint">Hint</button><button class="ghost" id="give">Give up</button></div>
</main>
<script>
const P={
animals:"dog cat lion elephant tiger monkey bird fish horse cow",
birthday:"celebration cake candle balloon family party hat friend wish card",
beach:"sand sea sun waves shell swim towel umbrella summer sunscreen",
rain:"umbrella cloud storm water puddle wet thunder drop wind weather",
school:"teacher student book pencil class homework lesson desk friends bag",
kitchen:"cook oven fridge knife stove sink plate food spoon table",
hospital:"doctor nurse patient medicine bed surgery ambulance sick health bandage",
raya:"ketupat rendang lemang family kuih kampung festival songkok mosque visit",
wedding:"bride groom cake ring dress flowers love church guests vows",
football:"ball goal team player referee stadium kick match fans pitch",
music:"song guitar piano singer band dance rhythm concert radio melody",
garden:"flowers plants grass seeds water soil bees trees fence hose",
winter:"snow cold coat ice scarf gloves fire blanket frost season",
summer:"sun beach hot holiday swimming vacation sunshine shorts fruit heat",
farm:"cow barn tractor animals chicken field crops milk hay farmer",
zoo:"animals lion monkey elephant cage giraffe keeper children tickets zebra",
airport:"plane ticket passport luggage flight pilot security gate travel customs",
doctor:"nurse hospital medicine patient clinic stethoscope sick health injection checkup",
police:"officer badge uniform law crime siren station patrol court safety",
bakery:"bread cake flour oven pastry cookies sweet donut croissant smell",
library:"books quiet shelves reading librarian study card silence novel borrow",
supermarket:"shopping trolley food cashier fruit queue basket aisle groceries bag",
restaurant:"menu waiter food chef table bill dinner kitchen drinks tip",
camping:"tent fire forest marshmallows lantern backpack stars nature hiking campfire",
moon:"night stars sky light space full crescent tide astronaut craters",
coffee:"cup morning bean caffeine milk sugar cafe hot espresso latte",
pizza:"cheese slice tomato crust oven pepperoni delivery italian box toppings",
flower:"petal rose garden bee smell spring bloom stem vase colour",
ocean:"water waves fish blue whale ship deep salt beach shark",
forest:"trees animals leaves wood green path birds camping river mushrooms",
computer:"keyboard screen mouse internet laptop game software typing email desk",
phone:"call text screen camera battery charger apps message contact number",
car:"wheel engine road driver petrol seat traffic speed garage tyre",
train:"station track ticket carriage railway passenger engine platform journey whistle",
mountain:"peak climb snow hiking rock cliff valley high tall view",
money:"bank cash coins wallet salary shopping rich price spend save",
sleep:"bed pillow dream night blanket tired rest snore pyjamas alarm",
baby:"crying diaper milk bottle toy cradle mother smile sleep cute",
rainbow:"colours rain sky arch sun red blue magic treasure gold",
magic:"wand wizard trick rabbit spell hat cards illusion potion show",
space:"stars moon planet rocket astronaut galaxy sun dark orbit alien",
cat:"kitten meow whiskers fur tail milk mouse purr paws pet",
dog:"bark bone puppy leash tail loyal walk fetch pet collar"};
const HUES=[0,15,155,180,205,230,260,285,320];
const $=id=>document.getElementById(id);
let word="",ans=[],found=new Set(),hinted=new Set(),over=false,score=0,hue=-1;
function draw(){
  $("prompt").textContent=word;
  $("stat").textContent=`Found ${found.size} of ${ans.length}  |  Score ${score}`;
  $("board").innerHTML=ans.map((w,i)=>{
    const f=found.has(w),m=over&&!f,h=hinted.has(w)&&!f&&!m;
    const cls="ans"+(f?" found":"")+(m?" missed":"");
    const t=[...w].map((c,k)=>`<div class="t">${f||m?c:(h&&k===0?c:"")}</div>`).join("");
    return `<div class="${cls}"><span class="n">${i+1}</span><div class="tiles">${t}</div><span class="p">${f?"+"+(ans.length-i):""}</span></div>`;
  }).join("");
}
function start(){
  const keys=Object.keys(P).filter(k=>k!==word);
  word=keys[Math.floor(Math.random()*keys.length)];
  ans=P[word].split(" ").slice(0,8);
  let h;do{h=HUES[Math.floor(Math.random()*HUES.length)]}while(h===hue);
  hue=h;document.documentElement.style.setProperty("--h",h);
  found=new Set();hinted=new Set();over=false;score=0;
  $("msg").textContent="";$("g").value="";$("g").disabled=false;$("go").disabled=false;$("hint").disabled=false;
  draw();$("g").focus();
}
function finish(){over=true;$("g").disabled=true;$("go").disabled=true;$("hint").disabled=true}
function add(){
  if(over)return;
  let w=$("g").value.trim().toLowerCase().replace(/[^a-z]/g,"");
  $("g").value="";
  if(!w)return;
  if(!ans.includes(w)&&w.endsWith("s")&&ans.includes(w.slice(0,-1)))w=w.slice(0,-1);
  if(w===word){$("msg").textContent="That is the word you were given. List other words.";return}
  if(found.has(w)){$("msg").textContent="You already found that one.";return}
  const i=ans.indexOf(w);
  if(i>=0){
    found.add(w);score+=ans.length-i;$("msg").textContent=`${w}: +${ans.length-i} points`;
    if(found.size===ans.length){finish();$("msg").textContent=`You found all ${ans.length}! Score ${score}.`;draw();confetti();return}
    draw();
  }else $("msg").textContent=`"${w}" is not one of the top ${ans.length} for ${word}.`;
  $("g").focus();
}
function hint(){
  if(over)return;
  const w=ans.find(x=>!found.has(x)&&!hinted.has(x))||ans.find(x=>!found.has(x));
  if(!w)return;
  hinted.add(w);$("msg").textContent=`Hint: row ${ans.indexOf(w)+1} starts with "${w[0].toUpperCase()}".`;draw();
}
function giveUp(){
  if(over)return;
  finish();$("msg").textContent=`You found ${found.size} of ${ans.length}. Score ${score}. Here are the rest.`;draw();
}
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=document.createElement("canvas");c.id="confetti";c.width=innerWidth;c.height=innerHeight;document.body.append(c);
  const x=c.getContext("2d"),cols=[0,45,150,200,260,320].map(h=>`hsl(${h} 85% 55%)`);
  const ps=Array.from({length:150},()=>({x:innerWidth/2+(Math.random()-.5)*160,y:innerHeight*.35,vx:(Math.random()-.5)*15,vy:-Math.random()*13-4,s:6+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.floor(Math.random()*cols.length)]}));
  let t=0;
  (function f(){
    x.clearRect(0,0,c.width,c.height);t++;
    ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});
    if(t<160)requestAnimationFrame(f);else c.remove();
  })();
}
$("go").onclick=add;
$("g").onkeydown=e=>{if(e.key==="Enter")add()};
$("hint").onclick=hint;
$("give").onclick=giveUp;
$("new").onclick=start;
start();
</script>
</body>
</html>
