<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Related</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Rubik+Doodle+Shadow&display=swap" rel="stylesheet">
<style>
:root{--h:230;--bg:hsl(var(--h) 45% 96%);--ink:hsl(var(--h) 50% 18%);--panel:hsl(var(--h) 45% 88%);--dark:hsl(var(--h) 40% 50%);--muted:hsl(var(--h) 20% 42%);--pop:hsl(var(--h) 42% 44%);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:hsl(var(--h) 35% 12%);--ink:hsl(var(--h) 60% 95%);--panel:hsl(var(--h) 30% 19%);--dark:hsl(var(--h) 36% 46%);--muted:hsl(var(--h) 25% 70%);--pop:hsl(var(--h) 38% 46%)}}
:root[data-theme="dark"]{--bg:hsl(var(--h) 35% 12%);--ink:hsl(var(--h) 60% 95%);--panel:hsl(var(--h) 30% 19%);--dark:hsl(var(--h) 36% 46%);--muted:hsl(var(--h) 25% 70%);--pop:hsl(var(--h) 38% 46%)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Outfit",system-ui,sans-serif;font-size:18px;display:flex;justify-content:center}
main{width:100%;max-width:520px;padding:24px 16px 40px;text-align:center}
h1{margin:0 0 8px;font-family:"Rubik Doodle Shadow","Outfit",system-ui,sans-serif;font-weight:400;font-size:clamp(30px,9.5vw,44px);letter-spacing:1px;line-height:1.1}
.sub{margin:0 0 16px;color:var(--muted);font-size:18px}
.prompt{background:var(--panel);border-radius:14px;padding:16px 8px;margin:0 auto 12px;max-width:420px}
.prompt small{display:block;color:var(--muted);font-size:18px;margin-bottom:4px}
.prompt b{display:block;font-size:clamp(34px,11vw,52px);font-weight:700;line-height:1.1;letter-spacing:2px;text-transform:uppercase;word-break:break-word}
.ans{display:flex;align-items:center;justify-content:center;gap:8px;margin:8px 0}
.ans .p{width:36px;text-align:left;color:var(--muted);font-size:16px;font-weight:700}
.tiles{display:flex;gap:4px;justify-content:center;min-width:0}
.t{flex:0 1 auto;min-width:0;width:clamp(20px,7.4vw,42px);height:clamp(34px,11vw,56px);border-radius:6px;background:var(--panel);display:grid;place-items:center;font-size:clamp(15px,5.6vw,30px);font-weight:800;text-transform:uppercase;color:var(--ink)}
.ans.found .t{background:var(--dark);color:#fff}
.ans.missed .t{background:var(--panel);color:var(--muted);outline:2px solid var(--muted);outline-offset:-2px}
.t.hl{background:var(--dark);color:#fff}
#boardwrap{position:relative}
#g{position:absolute;top:0;left:0;width:1px;height:1px;opacity:0;border:0;padding:0;font-size:16px;pointer-events:none}
.ans{cursor:pointer}
.ans.act .t{box-shadow:0 0 0 3px var(--dark)}
#board.no{animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.msg{min-height:26px;font-weight:600;margin:0 0 14px}
button{font:inherit;font-weight:600;padding:6px 18px;border-radius:8px;border:2px solid var(--muted);background:transparent;color:var(--ink);cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.end{margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:10}
.win{background:var(--pop);color:#fff;border-radius:10px;padding:12px;font-size:22px;font-weight:800;max-width:420px;margin:0 auto;animation:pop .5s ease-out;word-break:break-word}
.win .list{margin-top:8px;max-height:38vh;overflow-y:auto;text-align:left;font-size:17px;font-weight:600}
.win .list div{padding:4px 0;border-top:1px solid rgba(255,255,255,.3)}
.win .list b{font-weight:800}
.win .next{margin-top:8px;font-size:15px;font-weight:600;opacity:.85}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.win,#board.no{animation:none}}
@media (min-width:800px){
body{font-size:26px}
main{max-width:820px;padding-top:32px}
h1{font-size:66px;margin-bottom:12px}
.sub{font-size:25px}
.prompt{max-width:620px;padding:22px 12px}
.prompt small{font-size:25px}
.prompt b{font-size:72px}
.ans .p{font-size:22px;width:60px}
.t{width:64px;height:80px;font-size:42px}
.msg{min-height:40px}
.end button{padding:8px 26px}
.win{font-size:30px;max-width:620px}
.win .list{font-size:24px}
}
</style>
</head>
<body>
<main>
  <h1>Word Related</h1>
  <p class="sub" id="sub"></p>
  <div class="prompt"><small>Words related to</small><b id="prompt"></b></div>
  <div class="msg" id="msg" role="status"></div>
  <div id="boardwrap"><div id="board"></div><input id="g" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Type your word"></div>
  <div class="end"><button id="new">New game</button><button id="hint">Hint</button><button id="give">Give up</button></div>
</main>
<script>
const P={
animals:"dog cat lion elephant tiger monkey bird fish",

rain:"umbrella cloud storm water puddle wet thunder drop",

ocean:"water waves fish blue whale ship deep salt",

money:"bank cash coins wallet salary shopping rich price",
sleep:"bed pillow dream night blanket tired rest snore",
baby:"crying diaper milk bottle toy cradle mother smile",
rainbow:"colours rain sky arch sun red blue magic",
magic:"wand wizard trick rabbit spell hat cards illusion",
space:"stars moon planet rocket astronaut galaxy sun dark",
cat:"kitten meow whiskers fur tail milk mouse purr",
dog:"bark bone puppy leash tail loyal walk fetch",
fruit:"apple banana orange mango grape sweet juice tree",
vegetable:"carrot potato onion tomato green cabbage salad soup",
breakfast:"egg toast cereal coffee milk bread morning pancake",
chocolate:"sweet milk cake candy brown bar cocoa dark",
snow:"cold white winter ice snowman flakes ski fall",
fire:"hot flame smoke burn wood truck ash light",
water:"drink river rain wet sea ice swim bottle",
sun:"hot light sky day yellow shine summer moon",
night:"dark moon stars sleep bed day quiet dream",
day:"night sun morning light week time work holiday",
christmas:"tree gifts santa snow lights carols turkey reindeer",
halloween:"costume candy pumpkin ghost witch scary mask spooky",
bird:"wings fly feather nest egg sky tree song",
fish:"sea water swim fins scales net bowl hook",
bee:"honey flower sting hive wings buzz wax queen",
butterfly:"wings flower caterpillar garden fly insect cocoon spring",
spider:"web insect legs eight scary fly silk bite",
snake:"venom scales tail reptile long hiss bite skin",
elephant:"trunk tusks big grey ears zoo africa heavy",
lion:"king mane roar jungle cat pride africa claws",
bear:"honey forest paws fur cave brown grizzly teddy",
monkey:"banana tree tail jungle zoo climb ape swing",
horse:"ride saddle hooves mane stable gallop farm race",
cow:"milk farm grass moo cheese beef barn field",
chicken:"egg farm rooster feathers fried nuggets coop wings",
bread:"butter toast bakery flour slice jam sandwich wheat",

exam:"test study paper marks result stress questions school",
sports:"football basketball running tennis swimming badminton team game",
gym:"weights exercise muscles fitness treadmill workout trainer sweat",
shopping:"mall clothes money bag shoes sale trolley store",
mall:"shopping shops food cinema escalator clothes parking people",
cinema:"movie popcorn screen ticket seats film dark actor",
party:"music cake dance balloons friends food drinks celebration",
ramadan:"fasting mosque dates prayer iftar family moon bazaar",
mosque:"prayer imam minaret dome islam friday quran carpet",
deepavali:"lights lamps sweets family rangoli festival oil prayer",
hotel:"room bed reception stay holiday pool breakfast key",
holiday:"beach travel family hotel vacation trip sun flight",
travel:"plane passport hotel luggage trip map tourist ticket",
bus:"stop driver ticket road seat school passengers city",

bicycle:"wheels pedal helmet ride chain road seat handlebar",
motorcycle:"helmet engine wheels ride fast road bike petrol",

ship:"sea captain sail ocean cargo anchor deck passengers",
house:"home roof door window family garden room kitchen",
bedroom:"bed pillow sleep blanket wardrobe lamp mirror curtain",
bathroom:"shower toilet sink towel soap mirror bath toothbrush",
clock:"time hands wall watch hour tick alarm minutes",
book:"read pages story library author cover novel school",
pen:"write ink paper pencil blue school notebook cap",
paper:"write book white pen print notebook tree newspaper",
camera:"photo lens picture flash film video tripod phone",
television:"show screen remote movie news channel cartoon sofa",
internet:"wifi website google phone computer online social browser",
game:"play win fun team ball score console players",
basketball:"ball hoop court team nba shoes dribble score",
swimming:"pool water goggles lanes sea summer towel swimsuit",
fishing:"rod sea fish boat river hook bait net",
cooking:"kitchen food pot recipe chef stove oil spices",
hair:"comb brush shampoo cut long salon black style",
eye:"see glasses vision blue brow tears lashes pupil",
hand:"finger thumb glove wave arm palm nails hold",
heart:"love beat red blood valentine pump chest attack",
tooth:"dentist brush smile teeth paste fairy white cavity",
smile:"happy teeth face laugh joy friendly cheek lips",
love:"heart valentine romance family kiss flowers couple hug",
friend:"buddy fun trust play school together happy laugh",
family:"mother father children home love parents together dinner",
mother:"love child family care cooking hug mom father",
father:"dad family child work strong love mother protect"};
const HUES=[0,15,155,180,205,230,260,285,320];
const NEXT=8;
const $=id=>document.getElementById(id);
let word="",ans=[],found=new Map(),hinted=new Map(),over=false,hue=-1,round=0,flashT,tickT,startT;
function flash(t,ms){const m=$("msg");if(over)return;m.textContent=t;clearTimeout(flashT);flashT=setTimeout(()=>{if(!over)m.textContent=""},ms||1800)}
const pts=i=>ans.length-i;
const total=()=>[...found.keys()].reduce((s,w)=>s+pts(ans.indexOf(w)),0);
let typed="",sel=-1;
const maxLen=()=>Math.max(0,...ans.filter(w=>!found.has(w)).map(w=>w.length));
function dispRow(){
  if(over||!typed)return -1;
  const ok=i=>i>=0&&i<ans.length&&!found.has(ans[i])&&ans[i].length>=typed.length;
  if(ok(sel))return sel;
  return ans.findIndex((w,i)=>ok(i));
}
function draw(){
  $("prompt").textContent=word;
  typed=typed.slice(0,maxLen());
  const d=dispRow();
  $("board").innerHTML=ans.map((w,i)=>{
    const f=found.has(w),m=over&&!f,lv=(!f&&!m&&hinted.get(w))||0,a=i===d;
    const cls="ans"+(f?" found":"")+(m?" missed":"")+(a?" act":"");
    const t=[...w].map((c,k)=>{
      if(f||m)return `<div class="t">${c}</div>`;
      if(a&&k<typed.length)return `<div class="t">${typed[k]}</div>`;
      const hl=lv>=1&&k===0||lv>=2&&k===w.length-1;
      return hl?`<div class="t hl">${c}</div>`:`<div class="t"></div>`;
    }).join("");
    return `<div class="${cls}" data-i="${i}"><div class="tiles">${t}</div><span class="p">${f?"+"+pts(i):""}</span></div>`;
  }).join("");
  $("hint").disabled=over||ans.every(w=>found.has(w)||hinted.get(w)>=2);
}
function lock(){over=true;$("g").disabled=true;$("hint").disabled=true;$("give").disabled=true}
function start(){
  clearTimeout(startT);clearInterval(tickT);round++;
  const keys=Object.keys(P).filter(k=>k!==word);
  word=keys[Math.floor(Math.random()*keys.length)];
  ans=P[word].split(" ");
  $("sub").textContent=`Find the ${ans.length} most common words related to the word below.`;
  let h;do{h=HUES[Math.floor(Math.random()*HUES.length)]}while(h===hue);
  hue=h;document.documentElement.style.setProperty("--h",h);
  found=new Map();hinted=new Map();over=false;typed="";sel=-1;
  $("msg").textContent="";$("g").value="";$("g").disabled=false;$("give").disabled=false;
  draw();
}
function newGame(){start();$("g").focus()}
function nameOf(who){let nm=who||"";try{nm=nm||(new URLSearchParams(location.search).get("name")||window.playerName||"").trim().slice(0,30)}catch(e){}return nm||"Player"}
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=document.createElement("canvas");c.id="confetti";c.width=innerWidth;c.height=innerHeight;document.body.append(c);
  const x=c.getContext("2d"),cols=[0,45,150,200,260,320].map(h=>`hsl(${h} 85% 55%)`);
  const ps=Array.from({length:150},()=>({x:innerWidth/2+(Math.random()-.5)*160,y:innerHeight*.35,vx:(Math.random()-.5)*15,vy:-Math.random()*13-4,s:6+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.floor(Math.random()*cols.length)]}));
  let t=0;
  (function f(){
    x.clearRect(0,0,c.width,c.height);t++;
    ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});
    if(t<160)requestAnimationFrame(f);else c.remove();
  })();
}
function players(){
  const m=new Map();
  found.forEach((who,w)=>{const p=m.get(who)||{name:who,words:[],pts:0};p.words.push(w);p.pts+=pts(ans.indexOf(w));m.set(who,p)});
  return [...m.values()].sort((a,b)=>b.pts-a.pts||b.words.length-a.words.length);
}
function popup(title){
  const m=$("msg");m.textContent="";
  const d=document.createElement("div");d.className="win";
  const l=document.createElement("div");l.className="wl";l.textContent=title;d.appendChild(l);
  const ps=players();
  if(ps.length){
    const list=document.createElement("div");list.className="list";
    ps.forEach((p,i)=>{
      const r=document.createElement("div");
      const b=document.createElement("b");b.textContent=`${i+1}. ${p.name}`;
      r.appendChild(b);
      r.appendChild(document.createTextNode(` ${p.pts} pts: ${p.words.join(", ")}`));
      list.appendChild(r);
    });
    d.appendChild(list);
  }
  const n=document.createElement("div");n.className="next";d.appendChild(n);
  m.appendChild(d);
  let s=NEXT;const set=()=>{n.textContent=`Next word in ${s}s`};set();
  clearInterval(tickT);tickT=setInterval(()=>{s--;if(s>0)set();else clearInterval(tickT)},1000);
  const r=round;clearTimeout(startT);startT=setTimeout(()=>{if(over&&round===r)start()},NEXT*1000);
}
function guess(word_,name){
  if(over)return"over";
  let w=String(word_||"").trim().toLowerCase().replace(/[^a-z]/g,"");
  if(!w)return"bad";
  if(!ans.includes(w)&&w.endsWith("s")&&ans.includes(w.slice(0,-1)))w=w.slice(0,-1);
  if(w===word){flash("That is the word you were given. List other words.");return"given"}
  if(found.has(w)){flash("That one is already found.");return"dup"}
  const i=ans.indexOf(w);
  if(i<0){flash(`"${w}" is not one of the top ${ans.length} for ${word}.`);return"wrong"}
  const who=nameOf(String(name||"").trim().slice(0,30));
  found.set(w,who);
  if(found.size===ans.length){
    lock();draw();
    const top=players()[0];
    popup(`${top.name} won with ${top.pts} points!`);confetti();
    return"ok";
  }
  draw();flash(`${who}: ${w} +${pts(i)}`);
  return"ok";
}
function shakeBoard(){const b=$("board");b.classList.remove("no");void b.offsetWidth;b.classList.add("no")}
function submit(){
  if(over||!typed)return;
  const r=guess(typed,"");
  typed="";$("g").value="";
  draw();
  if(r==="wrong"||r==="given"||r==="dup")shakeBoard();
  if(!over)$("g").focus();
}
$("g").oninput=()=>{
  typed=$("g").value.toLowerCase().replace(/[^a-z]/g,"").slice(0,maxLen());
  $("g").value=typed;draw();
  if(!typed)return;
  const left=ans.filter(w=>!found.has(w));
  const exact=left.includes(typed),longer=left.some(w=>w!==typed&&w.startsWith(typed));
  if((exact&&!longer)||typed.length>=maxLen())submit();
};
$("board").onclick=e=>{
  if(over)return;
  const row=e.target.closest(".ans");
  if(row){const i=+row.dataset.i;if(!found.has(ans[i])){sel=i;draw()}}
  $("g").focus();
};
document.addEventListener("click",e=>{if(!over&&!e.target.closest("button"))$("g").focus()});
document.addEventListener("keydown",e=>{if(!over&&document.activeElement!==$("g")&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&/^[a-zA-Z]$/.test(e.key))$("g").focus()});
$("g").onkeydown=e=>{if(e.key==="Enter")submit()};
$("hint").onclick=()=>{
  if(over)return;
  let w=ans.find(x=>!found.has(x)&&!hinted.get(x));
  if(w){hinted.set(w,1);flash(`Hint: one of the words starts with "${w[0].toUpperCase()}".`,2500)}
  else{
    w=ans.find(x=>!found.has(x)&&hinted.get(x)===1);
    if(!w){flash("No more hints for this word.");return}
    hinted.set(w,2);flash(`Hint: one of the words ends with "${w[w.length-1].toUpperCase()}".`,2500);
  }
  draw();$("g").focus();
};
$("give").onclick=()=>{
  if(over)return;
  lock();draw();
  popup(`You gave up. Found ${found.size} of ${ans.length}.`);
};
$("new").onclick=newGame;
window.submitGuess=guess;
window.addEventListener("message",e=>{const d=e.data;if(d&&d.type==="guess")guess(d.word,d.name)});
const LIVE=/[?&]live=1/.test(location.search)||location.protocol==="file:";
function tikfinity(){let ws;try{ws=new WebSocket("ws://127.0.0.1:21213/")}catch(e){return}
ws.onmessage=ev=>{try{const m=JSON.parse(ev.data),d=m.data||m;if(!/chat|comment/i.test(String(m.event||m.type||"")))return;const u=d.user||{};guess(d.comment||d.text||d.message,d.nickname||d.uniqueId||u.nickname||u.uniqueId)}catch(e){}};
ws.onclose=()=>setTimeout(tikfinity,3000);ws.onerror=()=>ws.close()}
if(LIVE)tikfinity();
newGame();
</script>
</body>
</html>
